name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional tag like v0.2.0 to publish after both platform builds pass
        required: false
        type: string
      draft:
        description: Publish as draft when a release tag is provided manually
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      publish: ${{ steps.resolve.outputs.publish }}
      draft: ${{ steps.resolve.outputs.draft }}
    steps:
      - id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            echo "release_tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "draft=${{ inputs.draft }}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Release preflight
        env:
          ARKKB_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: go run scripts/dev.go preflight

  build:
    needs:
      - prepare
      - validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_os: windows
            artifact_name: arkkb-windows-release
          - os: ubuntu-22.04
            target_os: linux
            artifact_name: arkkb-linux-release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install Linux desktop dependencies
        if: matrix.target_os == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            javascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Doctor
        env:
          ARKKB_TARGET_OS: ${{ matrix.target_os }}
        run: go run scripts/dev.go doctor

      - name: Frontend check
        working-directory: frontend
        run: npm run check

      - name: Go tests
        run: go test ./...

      - name: Build release artifacts
        env:
          ARKKB_TARGET_OS: ${{ matrix.target_os }}
          ARKKB_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: go run scripts/dev.go release

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: bin/release/${{ matrix.target_os }}
          if-no-files-found: error
          retention-days: 14

  publish:
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          mapfile -d '' asset_files < <(find dist -type f ! -name 'checksums-*.txt' -print0)
          if [ "${#asset_files[@]}" -eq 0 ]; then
            echo "no packaged release assets found under dist" >&2
            exit 1
          fi
          cp "${asset_files[@]}" release/

          mapfile -d '' checksum_files < <(find dist -type f -name 'checksums-*.txt' -print0)
          if [ "${#checksum_files[@]}" -eq 0 ]; then
            echo "no checksum files found under dist" >&2
            exit 1
          fi
          cat "${checksum_files[@]}" | sort > release/checksums.txt

          ls -la release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ needs.prepare.outputs.draft == 'true' }}
          prerelease: false
          generate_release_notes: true
          files: release/*
